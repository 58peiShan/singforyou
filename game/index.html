<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>潮約之歌</title>
<meta name="description" content="－我想知道妳所有的秘密">
<meta name="theme-color" content="#06122a">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="潮約之歌">
<meta name="format-detection" content="telephone=no">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/stage.css">
<link rel="stylesheet" href="css/screens.css">
<script>
  // 只有在網站上（http/https）才掛 manifest 與離線快取；雙擊 index.html（file://）時略過，避免主控台錯誤。
  if (/^https?:$/.test(location.protocol)) {
    var m = document.createElement('link');
    m.rel = 'manifest';
    m.href = 'manifest.webmanifest';
    document.head.appendChild(m);
  }
</script>
</head>
<body>
<div id="game" class="booting">

  <!-- ===== 舞台 ===== -->
  <div id="stage" aria-live="off">
    <div id="shaker">
      <div id="bg-layer">
        <div class="bg-slot" id="bg0"></div>
        <div class="bg-slot" id="bg1"></div>
      </div>
      <div id="sprite-layer"><div id="sprite-area"></div></div>
      <div id="cg-layer"></div>
    </div>
    <div id="fx-fade"></div>
    <div id="fx-flash"></div>

    <div id="ui-layer">
      <div id="choices" role="menu"></div>
      <div id="textbox" class="empty">
        <div id="face" aria-hidden="true"></div>
        <div id="nameplate"></div>
        <div id="text" aria-live="polite"></div>
        <div id="next-mark" aria-hidden="true"></div>
      </div>
      <!-- 手機版：快捷選單收進右上角的漢堡選單按鈕 -->
      <button type="button" id="qm-toggle" aria-label="選單" aria-controls="quickmenu" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <nav id="quickmenu" aria-label="快捷選單">
          <button type="button" data-q="save">存檔</button>
          <button type="button" data-q="load">讀檔</button>
          <button type="button" data-q="log">紀錄</button>
          <button type="button" data-q="auto">自動</button>
          <button type="button" data-q="skip">快進</button>
          <button type="button" data-q="hide">隱藏</button>
          <!-- 設定、標題：電腦版顯示文字，手機版展開後顯示齒輪、房子圖示 -->
          <button type="button" data-q="config" class="qm-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span>設定</span></button>
          <button type="button" data-q="title" class="qm-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1.5 1.5 0 0 1-1.5 1.5H15v-6.5H9v6.5H4.5A1.5 1.5 0 0 1 3 20z"/></svg><span>標題</span></button>
      </nav>
    </div>
    <div id="mode-badge" aria-hidden="true"></div>
    <div id="card" aria-live="polite"></div>
  </div>

  <!-- ===== 標題畫面 ===== -->
  <section id="title-screen" class="screen" aria-label="標題畫面">
    <!-- 故事書封面：羊皮紙書邊＋金框；封面圖放 assets/ui/封面.jpg，沒有時用動態海景 -->
    <div class="cover" aria-hidden="true">
      <div class="cover-art">
        <div class="sea-scene">
          <div class="sky"></div>
          <div class="stars"></div>
          <div class="moon"></div>
          <div class="moon-path"></div>
          <div class="wave w1"></div>
          <div class="wave w2"></div>
          <div class="wave w3"></div>
          <div class="bubbles"></div>
        </div>
      </div>
      <div class="cover-scrim"></div>
      <div class="cover-frame"></div>
    </div>
    <!-- 左上角書籤緞帶：CG 圖庫入口 -->
    <button type="button" class="bookmark" id="bookmark-gallery" aria-label="CG 圖庫"></button>
    <div class="title-wrap">
      <header class="title-head">
        <h1 class="game-title"><span class="bracket">《</span>潮約之歌<span class="bracket">》</span></h1>
        <span class="title-flourish" aria-hidden="true"></span>
        <p class="game-sub">－我想知道妳所有的秘密</p>
      </header>
      <nav class="title-menu" id="title-menu">
        <button type="button" data-t="new">開始遊戲</button>
        <button type="button" data-t="continue">繼續</button>
        <button type="button" data-t="load">讀取存檔</button>
        <button type="button" data-t="side"><span class="side-name">人魚篇</span></button>
        <button type="button" data-t="config">設定</button>
      </nav>
    </div>
    <p class="title-foot" id="title-foot"></p>
  </section>

  <div id="overlays"></div>
  <div id="toast" role="status" aria-live="polite"></div>
</div>

<noscript><p style="color:#fff;padding:2em">請開啟 JavaScript 才能遊玩。</p></noscript>

<script src="data/script.js"></script>
<script>
  // 測試用：index.html?data=test 會改讀 data/test.js（存檔也分開存），正式遊玩不需要。
  (function () {
    var m = /[?&]data=([\w.-]+)/.exec(location.search);
    if (m && m[1] !== 'script') {
      window.VN_DATA_TAG = m[1];
      document.write('<script src="data/' + m[1] + '.js"><\/script>');
    }
  })();
</script>
<script src="js/util.js"></script>
<script src="js/persist.js"></script>
<script src="js/art.js"></script>
<script src="js/audio.js"></script>
<script src="js/stage.js"></script>
<script src="js/engine.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
