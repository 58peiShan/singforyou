<svg xmlns="http://www.w3.org/2000/svg" width="260" height="260" viewBox="0 0 260 260">
  <!-- 紙張紋理（可無縫重複）：大塊斑駁＋細顆粒 -->
  <filter id="blot" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".012" numOctaves="3" seed="7" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 .55  0 0 0 0 .38  0 0 0 0 .14  0 0 0 .16 -.04"/>
  </filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 .40  0 0 0 0 .28  0 0 0 0 .10  0 0 0 .12 0"/>
  </filter>
  <rect width="260" height="260" filter="url(#blot)"/>
  <rect width="260" height="260" filter="url(#grain)"/>
</svg>
